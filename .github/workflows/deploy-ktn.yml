name: Deploy to ktn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, ktn]
    steps:
      - name: Deploy
        run: |
          cd /opt/services/sprout-track
          git fetch origin
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
