name: Deploy to ktn

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ktn-scripts/**'
      - '.dockerignore'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, ktn]
    steps:
      - name: Deploy
        run: |
          cd /opt/services/sprout-track
          git fetch origin
          git reset --hard origin/main
          docker compose -f docker-compose.yml -f docker-compose.ktn.yml up -d --build
          docker image prune -f
