services:
  app:
    image: ghcr.io/kautiontape/sprout-track:latest
    ports: !override
      - "127.0.0.1:8109:3000"
    environment:
      - TZ=America/New_York
      - COOKIE_SECURE=true
      - APP_URL=https://sprout.kautiontape.com
      - ROOT_DOMAIN=kautiontape.com

volumes:
  db-data:
    name: sprout-track_db-data
  env-data:
    name: sprout-track_env-data
  files:
    name: sprout-track_files

# Pin the default network to a subnet that does not overlap with the home LAN
# (192.168.1.0/24, reachable over Headscale subnet routing). Docker's default
# address pool spills into 192.168.0.0/16 once 172.x /16s are exhausted, which
# made the container treat the Hue Bridge IP as link-local.
networks:
  default:
    ipam:
      config:
        - subnet: 10.200.0.0/24
