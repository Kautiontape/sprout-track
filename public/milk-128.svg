<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft circular pastel field, matching potty-128 / bottle-128 treatment -->
  <circle cx="64" cy="64" r="60" fill="#ddf4f9"/>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="110" rx="34" ry="5" fill="#0e7490" opacity="0.15"/>

  <!-- Pouch body, filling most of the frame. Slight taper at the shoulders. -->
  <path d="M28 34 h72 v46 a30 30 0 0 1 -30 30 h-12 a30 30 0 0 1 -30 -30 z"
        fill="#fffdf7" stroke="#0e7490" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Milk: warm cream, filling the pouch to just above the midline -->
  <path d="M33.5 58 h61 v22 a24.5 24.5 0 0 1 -24.5 24.5 h-12 a24.5 24.5 0 0 1 -24.5 -24.5 z"
        fill="#fdefd2"/>
  <!-- Milk surface line -->
  <path d="M33.5 58 h61" stroke="#0e7490" stroke-width="4.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Side gussets, which is what makes it read as a pouch and not a jar -->
  <path d="M46 40 v62" stroke="#0e7490" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M82 40 v62" stroke="#0e7490" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Redraw silhouette over the fill so the outline stays crisp -->
  <path d="M28 34 h72 v46 a30 30 0 0 1 -30 30 h-12 a30 30 0 0 1 -30 -30 z"
        fill="none" stroke="#0e7490" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Zip-top seal -->
  <rect x="23" y="17" width="82" height="17" rx="6.5" fill="#4dd9ef" stroke="#0e7490" stroke-width="5.5"/>
  <path d="M36 25.5 h56" stroke="#0e7490" stroke-width="3.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Measurement ticks on the right panel -->
  <path d="M88 70 h9 M88 82 h9" stroke="#0e7490" stroke-width="3.4" stroke-linecap="round" opacity="0.4"/>

  <!-- Gloss highlight on the left panel -->
  <path d="M38 46 v46" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Frost sparkles, echoing the accent stars on potty-128 -->
  <path d="M110 46 l2.5 6.1 6.1 2.5 -6.1 2.5 -2.5 6.1 -2.5 -6.1 -6.1 -2.5 6.1 -2.5 z" fill="#0891b2"/>
  <path d="M14 60 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8 z" fill="#22d3ee"/>
</svg>
